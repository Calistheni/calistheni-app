<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Calistheni is unavailable</title>
    <style>
      :root { background: #09090b; color: #f8fafc; }
      body { align-items: center; background: #09090b; display: flex; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; justify-content: center; margin: 0; min-height: 100dvh; padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom)); text-align: center; }
      main { align-items: center; display: flex; flex-direction: column; gap: 1rem; max-width: 20rem; }
      .mark { align-items: center; background: #2563eb; border-radius: 1.5rem; display: flex; font-size: 2.5rem; font-weight: 800; height: 5.5rem; justify-content: center; width: 5.5rem; }
      h1 { font-size: 1.25rem; margin: .5rem 0 0; }
      p { color: #94a3b8; line-height: 1.5; margin: 0; }
      button { appearance: none; background: #2563eb; border: 0; border-radius: .75rem; color: white; font: inherit; font-weight: 700; min-height: 2.75rem; padding: .625rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">C</div>
      <h1>Calistheni is unavailable</h1>
      <p>Check your connection, then try loading the app again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        const serverUrl = window.Capacitor?.getServerUrl?.() || "https://calistheni.app";
        window.location.replace(serverUrl);
      });
    </script>
  </body>
</html>
